<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../../assets/css/style.css" rel="stylesheet" />
    <script src="../../assets/js/core/api.js" defer></script>
    <script src="../../assets/js/core/auth.js" defer></script>
    <script src="../../assets/js/core/dom.js" defer></script>
    <script src="../../assets/js/core/format.js" defer></script>
    <script src="../../assets/js/features/pet/pets.render.js" defer></script>
    <script src="../../assets/js/features/pet/pets.data.js" defer></script>
    <script src="../../assets/js/features/pet/pets.events.js" defer></script>
    <script src="../../assets/js/features/shared/shared.events.js" defer></script>
    <title>PawRecord</title>
  </head>
  <body>
    <aside class="sidebar sticky">
      <nav>
        <ul>
          <li><a class="sidebar-link" href="index.html">Home</a></li>
          <li><a class="sidebar-link" href="pets.html">Pets</a></li>
          <li><a class="sidebar-link" href="appointments.html">Appointments</a></li>
          <li><a class="sidebar-link" href="notifications.html">Notifications</a></li>
        </ul>
      </nav>
      <button type="button" id="sign-out" class="sign-out">Sign out</button>
    </aside>
    <main>
      <div class="split-view">
        <section id="pets-section">
          <div class="title-row">
            <h1>Pets</h1>
            <div class="toolbar">
              <input type="search" class="toolbar__search" placeholder="Search pet or owner" aria-label="Search pet or owner" />
              <label class="toolbar__filter">
                Filter by
                <select class="toolbar__select">
                  <option>Name</option>
                  <option>Species</option>
                  <option>Owner</option>
                </select>
              </label>
            </div>
          </div>
          <ul id="pets-list" class="pets-list"></ul>
        </section>
        <section id="pet-preview-section" class="sticky">
          <div class="empty-state">
            <p class="empty-state__title">No pets selected</p>
            <p class="empty-state__text">Pick a pet from the list to see its profile, latest record and visits.</p>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
