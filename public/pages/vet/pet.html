<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../../assets/css/style.css" rel="stylesheet" />
    <script src="../../assets/js/core/auth.js" defer></script>
    <script src="../../assets/js/core/dom.js" defer></script>
    <script src="../../assets/js/core/format.js" defer></script>
    <script src="../../assets/js/features/pet/pet.render.js" defer></script>
    <script src="../../assets/js/features/pet/pets.render.js" defer></script>
    <script src="../../assets/js/features/pet/pet.data.js" defer></script>
    <script src="../../assets/js/features/pet/pet.events.js" defer></script>
    <script src="../../assets/js/features/shared/shared.events.js" defer></script>
    <title>PawRecord</title>
  </head>
  <body>
    <aside class="sidebar sticky">
      <nav>
        <ul>
          <li><a class="sidebar-link" href="index.html">Home</a></li>
          <li><a class="sidebar-link" href="pets.html">Pets</a></li>
          <li><a class="sidebar-link" href="appointments.html">Appointments</a></li>
          <li><a class="sidebar-link" href="notifications.html">Notifications</a></li>
        </ul>
      </nav>
      <button type="button" id="sign-out" class="sign-out">Sign out</button>
    </aside>
    <main>
      <div class="split-view profile-split-view">
        <section id="pet-profile-section" class="sticky">
        </section>
        <section id="pet-activity-section">
          <div class="pet-activity__tabs" role="tablist" aria-label="Pet activity">
            <button type="button" role="tab" id="records-tab" aria-selected="true" aria-controls="records-panel">Records</button>
            <button type="button" role="tab" id="appointments-tab" aria-selected="false" aria-controls="appointments-panel" tabindex="-1">Appointments</button>
          </div>
          <div id="records-panel" class="pet-activity__panel" role="tabpanel" aria-labelledby="records-tab">
            <div class="toolbar">
              <input type="search" class="toolbar__search" placeholder="Search records" aria-label="Search records" />
              <label class="toolbar__filter">
                Filter by
                <select class="toolbar__select">
                  <option>All</option>
                  <option>Up to date</option>
                  <option>Due soon</option>
                  <option>Overdue</option>
                </select>
              </label>
            </div>
            <div id="records-list"></div>
          </div>
          <div id="appointments-panel" class="pet-activity__panel" role="tabpanel" aria-labelledby="appointments-tab" hidden>
            <div class="toolbar">
              <input type="search" class="toolbar__search" placeholder="Search appointments" aria-label="Search appointments" />
              <label class="toolbar__filter">
                Filter by
                <select class="toolbar__select">
                  <option>All</option>
                  <option>Pending</option>
                  <option>Confirmed</option>
                  <option>Completed</option>
                  <option>Cancelled</option>
                </select>
              </label>
            </div>
            <div id="appointments-list"></div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
