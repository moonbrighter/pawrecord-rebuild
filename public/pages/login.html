<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../assets/css/style.css" rel="stylesheet" />
    <script src="../assets/js/features/auth/login.events.js" defer></script>
    <title>PawRecord</title>
  </head>
  <body>
    <main class="flex-centered">
      <form id="login-form" class="login-form">
        <div class="field">
          <label for="username-input">Username</label>
          <input id="username-input" name="username" type="text" required />
        </div>
        <div class="field">
          <label for="password-input">Password</label>
          <input id="password-input" name="password" type="password" required />
        </div>
        <input type="submit" value="Sign in" />
      </form>
    </main>
  </body>
</html>
